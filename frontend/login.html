<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Placement & Internship Portal</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
font-family:"Segoe UI",sans-serif;
background-image:url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
}

.login-box{
position:relative;
z-index:1;
width:400px;
padding:35px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:16px;
color:white;
text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

input,select{
width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:none;
outline:none;
box-sizing:border-box;
}

button{
width:100%;
margin-top:15px;
padding:12px;
border-radius:8px;
border:none;
background:linear-gradient(135deg,#00c6ff,#0072ff);
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#msg{
margin-top:15px;
font-size:14px;
color:white;
}

.toggle{
margin-top:12px;
cursor:pointer;
text-decoration:underline;
color:#00c6ff;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="login-box">

<h2 id="formTitle">Login</h2>

<p id="formDesc">Access your account</p>

<input
type="text"
id="name"
placeholder="Full Name"
style="display:none;"
>

<input
type="email"
id="email"
placeholder="Email"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<select id="role" required>

<option value="">Select Role</option>

<option value="student">Student</option>

<option value="company">Company</option>

<option value="admin">Admin</option>

</select>

<button id="mainBtn" onclick="loginUser()">
Login
</button>

<p id="msg"></p>

<p class="toggle" id="toggleForm">
First time? Register
</p>

</div>

<script>

let isRegister = false;

// ================= TOGGLE =================

document
.getElementById("toggleForm")
.addEventListener("click", toggleForm);

function toggleForm(){

isRegister = !isRegister;

const title =
document.getElementById("formTitle");

const desc =
document.getElementById("formDesc");

const nameField =
document.getElementById("name");

const button =
document.getElementById("mainBtn");

const toggle =
document.getElementById("toggleForm");

const msg =
document.getElementById("msg");

msg.innerText = "";

if(isRegister){

title.innerText = "Register";

desc.innerText =
"Create your account";

nameField.style.display = "block";

button.innerText = "Register";

button.setAttribute(
"onclick",
"registerUser()"
);

toggle.innerText =
"Already have account? Login";

}
else{

title.innerText = "Login";

desc.innerText =
"Access your account";

nameField.style.display = "none";

button.innerText = "Login";

button.setAttribute(
"onclick",
"loginUser()"
);

toggle.innerText =
"First time? Register";

}

}

// ================= REGISTER =================

async function registerUser(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const role =
document.getElementById("role").value;

if(!name || !email || !password || !role){

document.getElementById("msg").innerText =
"Please fill all fields";

return;

}

try{

const res = await fetch(

"http://localhost:5001/api/auth/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name,
email,
password,
role

})

}

);

const data = await res.json();

document.getElementById("msg").innerText =
data.message;

if(res.ok){

setTimeout(()=>{

toggleForm();

},1000);

}

}
catch(err){

console.log(err);

document.getElementById("msg").innerText =
"Server error";

}

}

// ================= LOGIN =================

async function loginUser(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const role =
document.getElementById("role").value;

if(!email || !password || !role){

document.getElementById("msg").innerText =
"Please fill all fields";

return;

}

try{

const res = await fetch(

"http://localhost:5001/api/auth/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password,
role

})

}

);

const data = await res.json();

document.getElementById("msg").innerText =
data.message;

if(res.ok){

localStorage.setItem(
"userId",
data.userId || ""
);

localStorage.setItem(
"role",
data.role || role
);

localStorage.setItem(
"name",
data.name || ""
);

// REDIRECT

if(role === "student"){

window.location.href =
"dashboard-student.html";

}
else if(role === "company"){

window.location.href =
"dashboard-company.html";

}
else if(role === "admin"){

window.location.href =
"dashboard-admin.html";

}

}

}
catch(err){

console.log(err);

document.getElementById("msg").innerText =
"Server error";

}

}

</script>

</body>

</html>
